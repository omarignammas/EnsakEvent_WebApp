    <rect x="37" y="48" width="100" height="91" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="7"/>
    <path d="M58 34v30M116 34v30M39 78h96" fill="none" stroke="#0f766e" stroke-width="9" stroke-linecap="round"/>
