    <rect x="312" y="166" width="520" height="7" rx="3.5" fill="url(#accent)"/>
    <text x="312" y="220" fill="#dbeafe" font-size="27" font-weight="500">Plateforme de gestion des événements</text>
    <text x="312" y="260" fill="#ccfbf1" font-size="23">ENSA Kénitra</text>
